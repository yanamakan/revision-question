<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Make a Reservation</title>
</head>

<body>
    <header>
        <nav>
            <a href="#main">Skip to content</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="revervations.html">Reservations</a></li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <h1>Reserve a Table</h1>
        <section>
            <h2>Online Reservation Form</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required><br><br>

                <label for="time">Time:</label>
                <input type="time" id="time" name="time" required><br><br>

                <label for="guests">Number of Guests:</label>
                <select id="guests" name="guests">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select><br><br>

                <label for="special">Special Requests:</label><br>
                <textarea id="special" name="special" rows="4" cols="50"></textarea><br><br>

                <input type="submit" value="Submit Reservation">
            </form>
        </section>
    </main>
    <footer>
        <p>Address: 123 Main Street, Soweto, Johannesburg</p>
        <p>Hours: Mon-Fri 11am-10pm, Sat-Sun 12pm-11pm</p>
        <p>&copy; 2026 Soweto Soul Food. All rights reserved.</p>
    </footer>
</body>

</html>
